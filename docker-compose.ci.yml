services:
  db:
    image: postgres:15

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - sim-network

  api:
    build: .

    depends_on:
      - db

    env_file:
      - .env

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    networks:
      - sim-network

volumes:
  postgres_data:

networks:
  sim-network:
    driver: bridge
