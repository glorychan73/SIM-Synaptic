services:
  db:
    image: postgres:15
    container_name: sim-synaptic-db

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - sim-network

  api:
    build: .
    container_name: sim-synaptic-api

    depends_on:
      - db

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    networks:
      - sim-network

  nginx:
    image: nginx:latest
    container_name: sim-synaptic-nginx

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - sim-network

  jenkins:
    build:
      context: ./jenkins

    container_name: sim-synaptic-jenkins

    user: root

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - sim-network

volumes:
  postgres_data:
  jenkins_home:

networks:
  sim-network:
    driver: bridge
